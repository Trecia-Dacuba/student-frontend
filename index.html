<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --ink:#1b2433; --muted:#5d6b82; --line:#d9e0ea;
  --brand:#3b4cca; --brand-ink:#ffffff; --ok:#0f8f80; --bad:#c23b3b; --soft:#e8ebfb;
  --shadow:0 1px 2px rgba(27,36,51,.06),0 8px 24px rgba(27,36,51,.06);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
:root:not([data-theme="light"]){
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151f; --surface:#182030; --ink:#e8edf6; --muted:#97a4ba; --line:#2a3447;
    --brand:#7886f0; --brand-ink:#10151f; --ok:#3fcfbc; --bad:#ff8a8a; --soft:#222c4a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151f; --surface:#182030; --ink:#e8edf6; --muted:#97a4ba; --line:#2a3447;
  --brand:#7886f0; --brand-ink:#10151f; --ok:#3fcfbc; --bad:#ff8a8a; --soft:#222c4a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{margin:0;font-size:clamp(2rem,5vw,3rem);line-height:1.05;font-weight:700;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);max-width:46ch}
.tools{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.875rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.bad .dot{background:var(--bad)}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;font-size:1rem}
.layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.composer{padding:22px;position:sticky;top:20px}
h2{margin:0 0 4px;font-size:1.25rem;letter-spacing:-.01em}
.hint{margin:0 0 18px;color:var(--muted);font-size:.9rem}
label{display:block;font-weight:500;font-size:.9rem;margin:0 0 6px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{resize:vertical;min-height:110px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:1px;border-color:var(--brand)}
.field{margin-bottom:16px}
.count{display:block;text-align:right;color:var(--muted);font-size:.8rem;margin-top:4px}
.btn{width:100%;padding:12px 16px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.6;cursor:wait}
.feed-head{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.feed-head input{flex:1 1 200px}
.feed-head select{flex:0 0 auto;width:auto}
.meta{color:var(--muted);font-size:.9rem;margin:0 2px 12px}
.list{display:grid;gap:12px}
.rec{display:flex;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.rec.new{animation:pop .5s ease-out}
@keyframes pop{from{background:var(--soft);transform:scale(.985)}to{background:var(--surface);transform:none}}
.av{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff}
.rec h3{margin:0;font-size:1.05rem;line-height:1.3;overflow-wrap:anywhere}
.rec p{margin:4px 0 8px;color:var(--ink);opacity:.88;overflow-wrap:anywhere;white-space:pre-wrap}
.rec time{color:var(--muted);font-size:.8rem}
.state{padding:40px 20px;text-align:center;color:var(--muted)}
.state strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.state .btn{width:auto;margin-top:14px;padding:10px 18px}
.skel{height:84px;border-radius:14px;background:linear-gradient(90deg,var(--line),var(--soft),var(--line));background-size:200% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.layout{grid-template-columns:1fr}.composer{position:static}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Record Board</h1>
      <p class="sub">Add a record and it is saved to MongoDB Atlas. Everything below is read live from your database.</p>
    </div>
    <div class="tools">
      <span class="pill" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></span>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </div>
  </header>

  <div class="layout">
    <section class="panel composer" aria-labelledby="addTitle">
      <h2 id="addTitle">New record</h2>
      <p class="hint">Give it a short title and the details.</p>
      <form id="dataForm" autocomplete="off">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" maxlength="80" placeholder="e.g. Database 2 lab notes" required>
          <span class="count" id="titleCount">0 / 80</span>
        </div>
        <div class="field">
          <label for="content">Details</label>
          <textarea id="content" maxlength="500" placeholder="What do you want to remember?" required></textarea>
          <span class="count" id="contentCount">0 / 500</span>
        </div>
        <button class="btn" id="submitBtn" type="submit">Save record</button>
      </form>
    </section>

    <section aria-labelledby="listTitle">
      <h2 id="listTitle" class="sr" style="position:absolute;left:-9999px">Saved records</h2>
      <div class="feed-head">
        <input type="search" id="search" placeholder="Search records" aria-label="Search records">
        <select id="sort" aria-label="Sort records">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">Title A to Z</option>
        </select>
      </div>
      <p class="meta" id="meta" aria-live="polite"></p>
      <div class="list" id="recordsContainer"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// IMPORTANT: Replace this URL with your specific Vercel deployment URL
const VERCEL_API_URL = 'https://student-api-backend-one.vercel.app/api';

const $ = id => document.getElementById(id);
const COLORS = ['#3b4cca','#0f8f80','#b5527a','#c27a1d','#6a4fbf','#2f7fb8'];
let records = [];
let newestId = null;

// Safe text -> prevents user input from being run as HTML
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function colorFor(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'Just now';
  if (s < 3600) return Math.floor(s/60) + ' min ago';
  if (s < 86400) return Math.floor(s/3600) + ' hr ago';
  return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2600);
}
function setStatus(ok){
  const s = $('status');
  s.className = 'pill ' + (ok ? 'ok' : 'bad');
  $('statusText').textContent = ok ? 'Database connected' : 'Cannot reach database';
}
function showSkeleton(){
  const c = $('recordsContainer'); c.replaceChildren();
  for (let i = 0; i < 3; i++) c.appendChild(el('div','skel'));
}

function render(){
  const c = $('recordsContainer');
  const q = $('search').value.trim().toLowerCase();
  const mode = $('sort').value;
  let list = records.filter(r => (r.title + ' ' + r.content).toLowerCase().includes(q));
  list.sort((a,b) =>
    mode === 'az' ? (a.title||'').localeCompare(b.title||'') :
    mode === 'old' ? new Date(a.createdAt) - new Date(b.createdAt) :
    new Date(b.createdAt) - new Date(a.createdAt));

  $('meta').textContent = records.length
    ? (q ? list.length + ' of ' + records.length + ' records match' : records.length + (records.length === 1 ? ' record' : ' records'))
    : '';
  c.replaceChildren();

  if (!records.length){
    const s = el('div','state'); s.appendChild(el('strong',null,'No records yet'));
    s.appendChild(el('span',null,'Fill in the form to save your first record.'));
    c.appendChild(s); return;
  }
  if (!list.length){
    const s = el('div','state'); s.appendChild(el('strong',null,'No matches'));
    s.appendChild(el('span',null,'Try a different search word.'));
    c.appendChild(s); return;
  }
  list.forEach(r => {
    const card = el('article','rec' + (r._id === newestId ? ' new' : ''));
    const av = el('div','av',(r.title || '?').trim().charAt(0).toUpperCase());
    av.style.background = colorFor(r.title || '');
    const body = el('div');
    body.appendChild(el('h3',null,r.title));
    body.appendChild(el('p',null,r.content));
    const t = el('time',null,ago(r.createdAt)); t.dateTime = r.createdAt;
    body.appendChild(t);
    card.append(av, body); c.appendChild(card);
  });
  newestId = null;
}

async function loadRecords(){
  showSkeleton();
  try{
    const res = await fetch(VERCEL_API_URL);
    if (!res.ok) throw new Error('Bad response');
    records = await res.json();
    setStatus(true); render();
  }catch(err){
    setStatus(false);
    const c = $('recordsContainer'); c.replaceChildren();
    const s = el('div','state'); s.appendChild(el('strong',null,'Records could not load'));
    s.appendChild(el('span',null,'Check your internet connection and that the API is running.'));
    const b = el('button','btn','Try again'); b.type = 'button'; b.onclick = loadRecords;
    s.appendChild(b); c.appendChild(s); $('meta').textContent = '';
  }
}

$('dataForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = $('title').value.trim();
  const content = $('content').value.trim();
  if (!title || !content) return toast('Add a title and details first.');
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const res = await fetch(VERCEL_API_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title, content })
    });
    if (!res.ok) throw new Error('Save failed');
    const saved = await res.json(); newestId = saved._id;
    $('dataForm').reset(); $('titleCount').textContent = '0 / 80'; $('contentCount').textContent = '0 / 500';
    toast('Record saved'); setStatus(true);
    await loadRecords();
  }catch(err){
    setStatus(false); toast('Could not save. Check your connection and try again.');
  }finally{
    btn.disabled = false; btn.textContent = 'Save record';
  }
});

$('title').addEventListener('input', e => $('titleCount').textContent = e.target.value.length + ' / 80');
$('content').addEventListener('input', e => $('contentCount').textContent = e.target.value.length + ' / 500');
$('search').addEventListener('input', render);
$('sort').addEventListener('change', render);
$('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});

// Initial load
loadRecords();
</script>
</body>
</html>
